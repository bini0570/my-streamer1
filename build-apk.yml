name: Build & Release Android APK (ጎሪ እና ጅቦ)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Stage APK Artifact
        run: |
          mkdir -p build_output
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} build_output/Gori-ena-Jibo-v1.0.apk \;
          echo "=== Built APK Files ==="
          ls -lh build_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gori-ena-Jibo-v1.0-APK
          path: build_output/Gori-ena-Jibo-v1.0.apk
          retention-days: 90

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "📱 ጎሪ እና ጅቦ (Gori ena Jibo) v1.0.0 APK"
          draft: false
          prerelease: false
          body: |
            ## 📱 ጎሪ እና ጅቦ (Gori ena Jibo) Android APK
            
            Install the native Android camera app directly onto your device:
            - **8 Ethiopian Animal Lore Masks:** ጅቦ (Hyena), ጎሪ (Gorilla), ነብር (Tiger), አንበሳ (Lion), ተኩላ (Wolf), ዝንጀሮ (Monkey), ድብ (Bear), ቀበሮ (Fox)
            - **8 Cinema Masks:** Joker, Batman, Spider-Man, Iron Man, Black Panther, Deadpool, Ghostface, Darth Vader
            - Real-time CameraX & ARCore 3D Face Tracking
          files: build_output/Gori-ena-Jibo-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
